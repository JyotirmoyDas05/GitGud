name: Release

# Builds the Tauri app for Linux, macOS and Windows and attaches the
# installers to a GitHub Release.
#
# How to cut a release:
#   1. Make sure package.json, src-tauri/tauri.conf.json and
#      src-tauri/Cargo.toml all carry the same version
#      (or run scripts/cut-release.ps1 -Version <x.y.z>).
#   2. Push the tag:  git push origin v<x.y.z>
#   3. This workflow builds all platforms and creates a DRAFT release.
#      Review the draft and publish it manually.
#
# You can also run it manually (Actions tab -> Release -> Run workflow)
# for a build-only check: no GitHub Release is created off-tag.

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: ''
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macos
            os: macos-latest
            args: '--target universal-apple-darwin'
            bundles: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows
            os: windows-latest
            args: ''
            bundles: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets (Intel + Apple Silicon)
        if: matrix.name == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Only attach to a real release when a version tag was pushed.
    # Manual (workflow_dispatch) runs stop after the build above.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -R release-assets

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Git Gud ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release-assets/**/*
